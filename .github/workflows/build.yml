name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish official APK to GitHub Releases?"
        type: boolean
        required: true
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "USIMS-eSIM-Fix-v${{ steps.version.outputs.version }}.apk"

      - name: Validate official version
        if: github.ref_type == 'tag' || inputs.publish_release == true
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid versionName"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          else
            test "$GITHUB_REF" = 'refs/heads/main'
          fi

      - name: Publish official APK
        if: github.ref_type == 'tag' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          APK="USIMS-eSIM-Fix-v$VERSION.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the app version before publishing."
            exit 1
          fi
          gh release create "$TAG" "$APK" --title "USIMS eSIM Fix $TAG" --notes "Installable debug APK automatically built from the tagged source." --latest

      - name: Upload APK (manual test only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: USIMS-eSIM-Fix-v${{ steps.version.outputs.version }}
          path: USIMS-eSIM-Fix-v${{ steps.version.outputs.version }}.apk
          retention-days: 1
